<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>k6 개선 전/후 비교</title>
<!--
  두 실행의 reports/*.json 을 넣으면 차이를 표로 보여준다.

  파일을 <input type="file"> 로 직접 고르게 만든 이유: file:// 에서는 fetch 로 옆 파일을
  읽을 수 없다. 파일 선택은 사용자가 직접 준 것이라 그 제약을 받지 않는다.
  그래서 이 페이지도 서버 없이 그냥 열면 된다.
-->
<style>
  :root {
    --fg:#e8ecf4; --dim:#98a2b8; --line:rgba(255,255,255,.10); --card:rgba(17,21,33,.6);
    --accent:#7aa2ff; --good:#4ade80; --bad:#f87171; --flat:#94a3b8;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:#05070f; color:var(--fg); padding:40px 20px 100px;
         font:14.5px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { max-width:1040px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  h2 { font-size:15px; margin:32px 0 10px; color:var(--accent); }
  .sub { color:var(--dim); font-size:13.5px; margin-bottom:26px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .pick { display:grid; gap:14px; grid-template-columns:1fr 1fr; }
  @media (max-width:680px) { .pick { grid-template-columns:1fr; } }
  label.f { display:block; font-size:12.5px; color:var(--dim); margin-bottom:6px; }
  input[type=file] { width:100%; font:inherit; font-size:12.5px; color:var(--dim); }
  .who { margin-top:6px; font-size:12.5px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .card .label { color:var(--dim); font-size:12.5px; }
  .card .value { font-size:19px; font-weight:600; margin-top:2px; }
  .card .delta { font-size:12.5px; margin-top:2px; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; min-width:620px; }
  th,td { text-align:right; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:500; font-size:12.5px; }
  .good { color:var(--good); } .bad { color:var(--bad); } .flat { color:var(--flat); }
  .note { color:var(--dim); font-size:12.5px; border-left:2px solid var(--line);
          padding:2px 0 2px 12px; margin:12px 0; }
  code { background:rgba(0,0,0,.45); border:1px solid var(--line); border-radius:4px;
         padding:1px 5px; font-size:12px; }
</style>
</head>
<body><div class="wrap">

<h1>k6 개선 전/후 비교</h1>
<div class="sub">
  <code>k6/reports/</code> 에 저장된 두 실행의 <code>.json</code> 을 고른다.
</div>

<div class="panel">
  <div class="pick">
    <div>
      <label class="f">개선 전 (기준)</label>
      <input type="file" id="fileA" accept=".json"/>
      <div class="who" id="whoA"></div>
    </div>
    <div>
      <label class="f">개선 후 (비교 대상)</label>
      <input type="file" id="fileB" accept=".json"/>
      <div class="who" id="whoB"></div>
    </div>
  </div>
</div>

<div id="out"></div>

<div class="note" style="margin-top:30px">
  여기 숫자는 <b>클라이언트가 기다린 시간</b>이다. 서버 내부에서 무엇이 달라졌는지는
  Grafana 의 스프링부트 성능 대시보드를 두 실행 시각으로 맞춰 봐야 한다 —
  JVM 힙·톰캣 스레드·HikariCP 대기가 거기 있다.
  <br><br>
  <b>두 실행의 조건이 같아야 비교가 성립한다.</b> VU·유지 시간·고른 API 가 다르면
  아래 표는 성능 차이가 아니라 조건 차이를 보여준다. 아래에 조건이 다른 항목을 표시한다.
</div>

</div>

<script>
/* =========================================================================
 * 상태
 * ======================================================================= */
const runs = { A: null, B: null };

document.getElementById('fileA').onchange = (e) => load(e, 'A');
document.getElementById('fileB').onchange = (e) => load(e, 'B');

function load(event, slot) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      runs[slot] = JSON.parse(reader.result);
    } catch (err) {
      runs[slot] = null;
      document.getElementById('who' + slot).innerHTML =
        '<span class="bad">JSON 을 읽지 못했다: ' + esc(err.message) + '</span>';
      return;
    }
    const meta = runs[slot].meta || {};
    document.getElementById('who' + slot).textContent =
      (meta.testid || file.name) + ' · ' + (meta.profile || '?') + ' · ' + (meta.baseUrl || '');
    render();
  };
  reader.readAsText(file);
}

/* =========================================================================
 * 표시 도구
 * ======================================================================= */
function esc(t) {
  return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function ms(v) {
  if (v === undefined || v === null || Number.isNaN(v)) return '-';
  return v >= 1000 ? (v / 1000).toFixed(2) + 's' : v.toFixed(1) + 'ms';
}
function pct(v) {
  if (v === undefined || v === null || Number.isNaN(v)) return '-';
  return (v * 100).toFixed(2) + '%';
}

/**
 * 변화율. lowerIsBetter 는 지연·실패율처럼 작을수록 좋은 값에 쓴다.
 *
 * 5% 안쪽은 '차이 없음'으로 본다. 부하 테스트는 실행마다 그 정도는 흔들려서,
 * 3% 개선을 성과로 말하면 다음 실행에서 뒤집힌다.
 */
function delta(before, after, lowerIsBetter) {
  if (before === undefined || after === undefined || before === null || after === null) {
    return { text: '-', cls: 'flat' };
  }
  if (before === 0 && after === 0) return { text: '변화 없음', cls: 'flat' };
  if (before === 0) return { text: '신규', cls: 'flat' };

  const change = ((after - before) / before) * 100;
  const sign = change > 0 ? '+' : '';
  const text = sign + change.toFixed(1) + '%';

  if (Math.abs(change) < 5) return { text: text + ' (차이 없음)', cls: 'flat' };
  const improved = lowerIsBetter ? change < 0 : change > 0;
  return { text: text, cls: improved ? 'good' : 'bad' };
}

function value(run, metric, stat) {
  const m = (run.metrics || {})[metric];
  if (!m || !m.values) return undefined;
  return m.values[stat];
}

function endpointKeys(run) {
  return Object.keys(run.metrics || {})
    .filter((n) => n.indexOf('ep_') === 0)
    .map((n) => n.slice(3));
}

/* =========================================================================
 * 렌더
 * ======================================================================= */
function render() {
  const out = document.getElementById('out');
  if (!runs.A || !runs.B) {
    out.innerHTML = '';
    return;
  }
  const A = runs.A, B = runs.B;
  const metaA = A.meta || {}, metaB = B.meta || {};

  // ---- 조건이 같은지 먼저 본다 ----
  const diffs = [];
  if (metaA.profile !== metaB.profile) diffs.push('프로파일 (' + metaA.profile + ' vs ' + metaB.profile + ')');
  if (metaA.apiCount !== metaB.apiCount) diffs.push('고른 API 수 (' + metaA.apiCount + ' vs ' + metaB.apiCount + ')');
  if (metaA.accounts !== metaB.accounts) diffs.push('계정 수 (' + metaA.accounts + ' vs ' + metaB.accounts + ')');
  if (metaA.baseUrl !== metaB.baseUrl) diffs.push('대상 서버');

  const vuA = value(A, 'vus_max', 'max'), vuB = value(B, 'vus_max', 'max');
  if (vuA !== vuB) diffs.push('최대 VU (' + vuA + ' vs ' + vuB + ')');

  let html = '';

  if (diffs.length) {
    html +=
      '<h2>주의 — 실행 조건이 다르다</h2><div class="panel"><div class="bad">' +
      esc(diffs.join(' / ')) +
      '</div><div class="note" style="margin-bottom:0">' +
      '조건이 다르면 아래 차이는 성능 개선이 아니라 조건 차이일 수 있다. ' +
      '같은 설정으로 다시 돌려 비교하는 편이 낫다.</div></div>';
  }

  // ---- 전체 요약 ----
  const summary = [
    ['지연 p95', value(A, 'http_req_duration', 'p(95)'), value(B, 'http_req_duration', 'p(95)'), ms, true],
    ['지연 p99', value(A, 'http_req_duration', 'p(99)'), value(B, 'http_req_duration', 'p(99)'), ms, true],
    ['지연 평균', value(A, 'http_req_duration', 'avg'), value(B, 'http_req_duration', 'avg'), ms, true],
    ['처리량 (req/s)', value(A, 'http_reqs', 'rate'), value(B, 'http_reqs', 'rate'), (v) => (v || 0).toFixed(2), false],
    ['실패율', value(A, 'http_req_failed', 'rate'), value(B, 'http_req_failed', 'rate'), pct, true],
  ];

  html += '<h2>전체</h2><div class="cards">';
  for (const [label, a, b, fmt, lower] of summary) {
    const d = delta(a, b, lower);
    html +=
      '<div class="card"><div class="label">' + esc(label) + '</div>' +
      '<div class="value">' + esc(fmt(b)) + '</div>' +
      '<div class="delta ' + d.cls + '">' + esc(d.text) + ' (전: ' + esc(fmt(a)) + ')</div></div>';
  }
  html += '</div>';

  // ---- 엔드포인트별 ----
  const keys = Array.from(new Set(endpointKeys(A).concat(endpointKeys(B)))).sort();
  const rows = keys.map((key) => {
    const a = value(A, 'ep_' + key, 'p(95)');
    const b = value(B, 'ep_' + key, 'p(95)');
    return { key, a, b, d: delta(a, b, true), gap: (b || 0) - (a || 0) };
  });
  // 나빠진 것부터. 개선을 보여주는 자리에서도 회귀를 먼저 봐야 한다.
  rows.sort((x, y) => y.gap - x.gap);

  html +=
    '<h2>엔드포인트별 p95</h2><div class="scroll"><table><thead><tr>' +
    '<th>API</th><th>개선 전</th><th>개선 후</th><th>변화</th><th>차이</th>' +
    '</tr></thead><tbody>';
  for (const r of rows) {
    html +=
      '<tr><td>' + esc(r.key) + '</td>' +
      '<td>' + esc(ms(r.a)) + '</td>' +
      '<td>' + esc(ms(r.b)) + '</td>' +
      '<td class="' + r.d.cls + '">' + esc(r.d.text) + '</td>' +
      '<td class="' + r.d.cls + '">' + (r.a === undefined || r.b === undefined ? '-' : esc((r.gap > 0 ? '+' : '') + ms(Math.abs(r.gap)).replace('-', ''))) + '</td></tr>';
  }
  html += '</tbody></table></div>';

  out.innerHTML = html;
}
</script>
</body>
</html>
