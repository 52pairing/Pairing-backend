# AI 서버(Pairing-python) 호출의 재시도·차단기. 매칭 어댑터(PythonMatchingAdapter)만 쓴다.
#
# **이 파일이 값의 유일한 출처다.** application.yaml 은 운영용(src/main/resources)과 테스트용
# (src/test/resources)이 따로 있는데, 테스트용이 운영용을 통째로 가린다. 그래서 값을 양쪽에
# 적어두면 한쪽만 고쳐져서 갈린다 - 실제로 그 상태에서 정책 테스트가 "실제와 다른 설정"을
# 검증할 뻔했다(2026-08-13). 양쪽 application.yaml 은 이 파일을 import 만 한다.
#
# 이 파일이 없어지면 서버가 기동에 실패한다. 그게 낫다 - 설정이 조용히 빠지면 resilience4j
# 기본값으로 도는데, 차단기 기본값(minimum-number-of-calls=100)은 이 호출량에서 영원히
# 안 채워져서 **붙어만 있고 동작은 안 하는** 상태가 된다. 실제로 그랬다.
resilience4j:
  retry:
    instances:
      pythonMatchingApi:
        # 최초 1회 + 재시도 2회. 파이썬 재배포로 연결이 끊기는 상황이 표적이고 그건 대개 몇 초다.
        max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        # **연결 단계 실패만 재시도한다.** ResourceAccessException 은 연결 거부·타임아웃처럼
        # 요청이 상대에 닿지도 못했거나 응답을 못 받은 경우다. Gemini 를 부르기 전이라
        # 다시 불러도 추가 비용이 없고, 파이썬이 돌아오면 성공한다.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
        # **5xx 는 일부러 재시도하지 않는다.** 파이썬은 Gemini 실패를 502(AI_012/AI_014),
        # 504(AI_013)로 내려주는데, 그 시점엔 파이썬이 **이미 Gemini 를 재시도한 뒤**다
        # (같은 키 2회 + 키 회전, app/clients/gemini.py). 여기서 또 부르면 한 번의 추천에
        # Gemini 호출이 3배로 불어난다 - 성공 확률은 거의 안 오르고 비용만 는다.
        #
        # 4xx 는 우리 요청이 틀린 것이라 몇 번을 불러도 같다. 특히 "후보 없음"(AI_020, 404)은
        # 장애가 아니라 정상 결과다.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      pythonMatchingApi:
        # 기본값(sliding-window-size=100, minimum-number-of-calls=100)은 이 호출량
        # (프로젝트 착수금 결제 시 한 번씩)에서 영원히 안 채워진다. 10번 중 5번 실패면 연다.
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # 열린 동안은 60초 읽기 타임아웃을 매번 기다리지 않고 즉시 실패한다.
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
        # 4xx 는 상대 서버 장애가 아니라 우리 요청 문제라 차단기를 열 이유가 없다.
        # "후보 없음"(404)으로 차단기가 열리면 멀쩡한 다른 프로젝트의 추천까지 막힌다.
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
