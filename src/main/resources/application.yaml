spring:
  application:
    name: pairing

  config:
    # AI 매칭의 재시도 설정. 값은 저 파일 한 곳에만 둔다 — 테스트용 application.yaml 이
    # 이 파일을 통째로 가리기 때문에, 여기 직접 적으면 운영과 테스트 값이 갈린다.
    import: classpath:matching-retry.yaml

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        # 로컬(평문 Docker Redis)은 false, 전송 중 암호화를 쓰는 관리형 Redis는 true
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      connect-timeout: 10000ms
      lettuce:
        shutdown-timeout: 200ms

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pairing}
    username: ${DB_USERNAME:pairing}
    password: ${DB_PASSWORD:pairing}

  jpa:
    open-in-view: false
    hibernate:
      # 스키마의 단일 소스는 여전히 db/init/02-create-schema.sql 이다.
      # update 는 엔티티가 있는 테이블의 누락 컬럼만 채운다. 아래는 채워 주지 않으니 SQL 을 먼저 실행해야 한다.
      #   - 엔티티가 없는 테이블(스켈레톤 도메인 전체)
      #   - 유니크 제약, 부분 인덱스, FK 이름, 컬럼 코멘트
      #   - 약관 시드(db/init/03-seed-terms.sql). 없으면 회원가입이 막힌다.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: Asia/Seoul
          # saveAll 을 호출해도 이 값이 없으면 INSERT 가 건별로 나간다. 협상은 라운드당 조건 수만큼
          # 메시지를 한꺼번에 쌓으므로 배치로 묶어 왕복을 줄인다.
          batch_size: 50
        # 배치는 같은 테이블 연속일 때만 묶인다. 섞여 들어와도 묶이도록 정렬한다.
        order_inserts: true
        order_updates: true

  mail:
    # 인증 메일 발송용 SMTP. 값은 환경변수로만 주입한다.
    # host 기본값을 두는 이유는 JavaMailSender 빈이 항상 생성되게 하기 위함이다.
    # (프로퍼티가 없으면 자동설정이 빈을 만들지 않아 메일 어댑터 주입이 실패한다)
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB

server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    mbeanregistry:
      # 톰캣 스레드풀 메트릭(tomcat_threads_busy_threads / _current_threads / _config_max)을
      # 켠다. 기본값 false 라 켜지 않으면 액추에이터에 아예 안 나온다.
      #
      # 이게 필요한 이유: 요청이 느려질 때 원인이 "처리가 느림"인지 "스레드가 없어서 큐에서
      # 기다림"인지 구분해야 한다. busy/max 비율이 1에 가까우면 후자다. 이 지표가 없으면
      # 지연 그래프만 보고 애플리케이션 코드를 뒤지게 된다.
      enabled: true

logging:
  level:
    org.hibernate.SQL: debug

springdoc:
  default-produces-media-type: application/json
  swagger-ui:
    # @Tag 이름에 붙인 번호 순서대로 정렬한다. (01. Auth → 02. Freelancer → ...)
    tags-sorter: alpha
    operations-sorter: method
    # 모든 태그를 접은 상태로 열어 전체 API 구조를 한눈에 볼 수 있게 한다.
    doc-expansion: none

jwt:
  # 실제 키 기본값을 두지 않는다. 미주입 시 기동이 실패하도록 해서, 공개된 키로 서명된 토큰이
  # 운영에 나가는 상황을 막는다. (생성 예: openssl rand -base64 48)
  #
  # 빈 문자열을 기본값으로 둔 이유: 플레이스홀더 치환 자체가 실패하면 "Unsatisfied dependency"
  # 같은 원인 불명 메시지만 보인다. 빈 값으로 들여보낸 뒤 GlobalJwtProvider가 검증해
  # 무엇을 주입해야 하는지 알려주는 편이 낫다.
  secret-key: ${JWT_SECRET_KEY:}
  access-token-expiration: 1800000 # 30분
  refresh-token-expiration: 604800000 # 7일
  # 값을 비워두면 쿠키에 Domain 속성을 붙이지 않아(host-only) localhost에서도 정상 동작한다.
  cookie-domain: ${COOKIE_DOMAIN:}
  # 로컬(http)에서는 false, 배포(https)에서는 true
  cookie-secure: ${COOKIE_SECURE:false}

app:
  auth:
    # 발신자 주소. SMTP 계정과 다르면 메일 서버가 거부할 수 있다.
    from-address: ${MAIL_FROM:no-reply@pairing.local}
    # 비밀번호 재설정 링크를 조립할 프론트엔드 주소
    front-base-url: ${APP_FRONT_BASE_URL:http://localhost:17000}
    # 아래 기준값은 요구사항 R13/R14에서 온다. 코드에도 같은 기본값이 있으니 함께 바꾼다.
    email-code-ttl: 3m           # 인증코드 유효시간
    email-code-max-attempt: 5    # 코드 입력 시도 상한(초과 시 폐기)
    email-send-limit: 15         # 이메일 발송 상한
    email-send-window: 1h        # 발송 상한 집계 구간
    verified-marker-ttl: 30m     # 인증 완료 후 가입 제출까지 유효한 시간
    login-fail-max: 5            # 비밀번호 연속 실패 잠금 기준
    ip-fail-max: 20              # IP 기준 로그인 실패 상한
    ip-fail-window: 1h           # IP 실패 집계 구간
    ip-block-duration: 2h        # IP 차단 유지 시간
    password-reset-ttl: 3m       # 비밀번호 재설정 링크 유효시간
    signup-ticket-ttl: 30m       # 소셜 가입 티켓 유효시간
    oauth-state-ttl: 5m          # 소셜 인가 state 유효시간
    rejoin-restriction-days: 30  # 탈퇴 후 재가입 제한
    minimum-age: 18              # 가입 가능 최소 연령(만)

  oauth:
    # 소셜 로그인은 프리랜서 전용이다. 값은 환경변수로만 주입한다.
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:17000/oauth/callback/kakao}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:17000/oauth/callback/google}

  crypto:
    # 카드번호·계좌번호 AES-256-GCM 키(Base64, 32바이트). jwt.secret-key와 같은 이유로 기본값을 두지 않는다.
    # 생성: openssl rand -base64 32
    data-key: ${DATA_ENCRYPTION_KEY:}

  cors:
    # 프론트엔드 도메인을 명시한다. (와일드카드 * 는 credentials와 함께 사용할 수 없음)
    # WebSocket 핸드셰이크 허용 오리진도 이 값을 함께 사용한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:17000,http://127.0.0.1:17000}

  websocket:
    # STOMP 핸드셰이크 경로(쉼표로 여러 개). 바꾸면 GlobalSecurityConfig의 permitAll 경로도 함께 맞춰야 한다.
    #
    # /api/ws 를 함께 여는 이유: 배포 ALB 가 /api/* 만 백엔드로 보내고 나머지는 프론트로 보낸다.
    # 그래서 /ws 핸드셰이크는 백엔드에 닿지 못한다(프론트가 404 를 돌려준다). ALB 규칙 추가를
    # 기다리지 않고 우리 쪽에서 해결하려고 /api/ws 를 추가했다. 프론트 전환이 끝나면 /ws 는 지운다.
    endpoint: ${WEBSOCKET_ENDPOINT:/ws,/api/ws}

  # 협상(negotiation) 도메인이 쓰는 AI 서버 설정. matching의 top-level ai.pairing-python.* 와는
  # 별개 프로퍼티 경로다(같은 Pairing-python을 가리키지만 각 도메인이 독립적으로 추가함 — 정리 필요, TODO).
  ai:
    # 내부 AI 서버(FastAPI, pairing-python). 외부에 노출하지 않고 스프링만 호출한다.
    base-url: ${AI_BASE_URL:http://localhost:8000}
    # 파이썬과 공유하는 내부 호출 키(X-Internal-Api-Key). 값은 환경변수로만 주입한다.
    internal-api-key: ${AI_INTERNAL_API_KEY:}
    # 호출 타임아웃(ms). 초과·실패 시 협상 루프는 stub 제안으로 폴백한다.
    # 실측이 이 값을 계속 밀어올렸다: 20초 → 33초짜리 라운드에 잘림 → 60초 → 그것도 초과.
    # 다만 마지막 건은 모델 호출 자체가 23.4초였고 나머지 40초는 원인 미상이다(같은 조건의
    # 다음 호출은 16.7초). 값을 키우는 건 정상 응답을 버리지 않기 위한 것이지 원인 해결이 아니다.
    timeout-ms: ${AI_TIMEOUT_MS:120000}

ai:
  pairing-python:
    # AI 매칭 서버(Pairing-python, FastAPI) 주소. 기본값은 로컬 기동 포트(APP_PORT=8000).
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    # Pairing-python과 공유하는 내부 호출 키(INTERNAL_API_KEY와 같은 값).
    # jwt.secret-key와 같은 이유로 기본값을 두지 않는다.
    internal-api-key: ${AI_INTERNAL_API_KEY:}

cloud:
  aws:
    s3:
      # 단일 버킷명. 필수값이다. 도메인 구분은 버킷이 아니라 object key의 prefix로 표현한다.
      # 빈 기본값을 두는 이유는 jwt.secret-key와 동일하다. (S3Settings가 검증하고 안내한다)
      bucket: ${S3_BUCKET:}
      # 응답 URL 루트. 비워두면 https://{bucket}.s3.{region}.amazonaws.com 으로 조합한다.
      # CloudFront를 쓸 때만 해당 도메인을 넣는다.
      cdn-url: ${S3_CDN_URL:}
      # 환경 구분용 object key prefix. 같은 버킷을 로컬과 배포가 함께 쓸 때 폴더를 나눈다.
      #   로컬 S3_KEY_PREFIX=local -> local/profile/{uuid}.png
      #   배포 S3_KEY_PREFIX=dev   -> dev/profile/{uuid}.png
      # 비우면 prefix 없이 저장한다. 값을 바꿔도 이미 DB에 저장된 key는 그대로 유효하고,
      # 새로 올리는 파일만 새 폴더로 들어간다.
      key-prefix: ${S3_KEY_PREFIX:}
    credentials:
      # 비워두면 AWS 기본 자격증명 체인(환경변수 / ~/.aws / EC2·ECS IAM 역할)을 사용한다.
      # 배포 환경에서는 키를 심지 말고 IAM 역할을 쓰는 편이 안전하다.
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:ap-northeast-2}

management:
  server:
    # 액추에이터를 어느 포트로 열지. 기본값은 server.port 와 같은 8080이다.
    #
    # 8080(=server.port와 동일)이면 스프링은 관리 컨텍스트를 따로 만들지 않고 기존 포트를 쓴다.
    # 즉 /actuator/health 가 지금 위치에 그대로 남는다. ALB 타깃그룹 헬스체크가 이 경로를
    # 보고 있으므로(README 참고) 기본값을 바꾸면 안 된다.
    #
    # 9090으로 분리하려면 아래 순서를 지켜야 한다. 순서를 어기면 타깃이 전부 unhealthy 로
    # 빠져 서비스가 내려간다. management.server.port 를 다른 값으로 주는 순간 /actuator/**
    # '전체'가 그 포트로 옮겨가고, 8080의 /actuator/health 는 404가 되기 때문이다.
    #
    #   1) 태스크 정의에 컨테이너 포트 9090 매핑 추가
    #   2) 앱 태스크 SG 인바운드 9090 에 모니터링 EC2 SG 허용
    #   3) ALB 타깃그룹 헬스체크를 포트 9090 / 경로 /actuator/health 로 변경
    #   4) 모니터링 레포 prometheus/prometheus.yml 의 pairing-backend job 포트를 9090 으로
    #   5) 그다음에 MANAGEMENT_PORT=9090 주입
    #
    # 참고로 8080에 둬도 ALB 는 /api/* 만 백엔드로 보내므로 /actuator/prometheus 는
    # 인터넷에서 라우팅되지 않는다. (헬스체크는 리스너 규칙을 우회해 타깃에 직접 붙는다)
    # 즉 분리하지 않아도 외부 노출은 없다. ALB 규칙에 catch-all 이 있는지만 확인하면 된다.
    port: ${MANAGEMENT_PORT:8080}

  endpoints:
    web:
      exposure:
        # prometheus 추가: 모니터링 서버의 Prometheus 가 /actuator/prometheus 를 긁는다.
        include: health, info, prometheus

  endpoint:
    health:
      show-details: always

  health:
    mail:
      # SMTP 헬스체크를 끈다. 켜두면 메일 계정이 주입되지 않았거나 메일 서버가 잠깐 흔들릴 때
      # /actuator/health 가 통째로 DOWN(503)이 되고, 오케스트레이터가 멀쩡한 컨테이너를 재시작한다.
      # 메일은 인증 흐름의 부가 기능이지 요청을 못 받을 이유가 아니다.
      enabled: false

  metrics:
    tags:
      # 모든 메트릭에 공통으로 붙는 라벨. 대시보드에서 서비스·환경을 구분하는 데 쓴다.
      # 태스크 구분은 Prometheus 가 instance/task 라벨로 붙여주므로 여기서 넣지 않는다.
      # (ECS 태스크 ID 를 앱이 알아내려면 메타데이터 엔드포인트를 호출해야 해서 값이 안 맞다)
      application: ${spring.application.name}
      env: ${APP_ENV:dev}

    distribution:
      # 지연 시간을 '히스토그램 버킷'으로 낸다. 이게 핵심이다.
      #
      # Micrometer 기본값은 태스크별로 계산된 백분위수(percentile)만 주는데, 이미 계산된
      # 백분위수는 태스크 간에 합산할 수 없다. 태스크 3개의 p95 를 평균한 값은 전체 p95 가
      # 아니다. ECS 태스크가 여러 개인 환경에서 "전체 p95" 를 보려면 버킷이 필요하다.
      # 버킷이 있으면 PromQL 의 histogram_quantile 이 태스크를 합쳐서 정확히 계산한다.
      #
      # percentiles-histogram 을 켜면 버킷이 70개 넘게 생겨서 t3.small 에는 부담이다.
      # 그래서 필요한 경계만 지정한다. 아래 값이 곧 그래프의 해상도가 된다.
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s, 10s, 30s
      # 위 경계 밖의 최소·최대값은 버킷으로 안 잡히므로 별도로 남긴다.
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 60s
