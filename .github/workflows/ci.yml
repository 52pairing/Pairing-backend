name: CI

# PR 에서만 빌드·테스트를 돌린다.
# develop / main push 는 deploy.yml 이 받아서 테스트까지 같이 돌리므로 여기서 중복 실행하지 않는다.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  # 같은 브랜치에 새 커밋이 올라오면 이전 실행을 취소한다.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      # 테스트는 H2 + 더미 설정(src/test/resources/application.yaml)으로 돌아간다.
      # PostgreSQL·Redis·S3 컨테이너가 없어도 통과한다.
      - name: Build and test
        run: ./gradlew --no-daemon build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
          if-no-files-found: ignore
