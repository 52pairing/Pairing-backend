name: Feature Request
description: 새로운 기능을 제안하고 기록하기 위한 템플릿입니다.
title: "[Feature] "
body:
  - type: input
    id: feature_name
    attributes:
      label: 기능명
      description: 추가하고자 하는 기능의 이름을 명확하게 적어주세요.
      placeholder: 예) 로그인 기능 구현
    validations:
      required: true

  - type: textarea
    id: feature_description
    attributes:
      label: 기능설명
      description: 해당 기능이 왜 필요한지, 어떤 역할을 하는지 상세히 적어주세요.
      placeholder: 로그인 시 JWT 토큰을 발급하여 반환하는 기능입니다.
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: 비고
      description: 기타 참고할 사항이나 관련 이슈가 있다면 적어주세요.
    validations:
      required: false
