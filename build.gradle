plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pairing'
version = '0.0.1-SNAPSHOT'
description = 'pairing'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 / 검증 / 영속성
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // 인증 / 인가
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // 메일 발송 (이메일 인증코드, 비밀번호 재설정 링크, 임시 비밀번호)
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // WebSocket (STOMP over WebSocket — 실시간 push)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Redis (RedisTemplate — 토큰 저장, 인증코드, 캐시성 데이터 등)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // AI 서버(Pairing-python) 호출 안정성: 서킷브레이커 + 분산 레이트리밋
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'com.bucket4j:bucket4j-redis:8.10.1'

    // S3 호환 오브젝트 스토리지 (AWS S3 / MinIO)
    implementation 'software.amazon.awssdk:s3:2.25.11'

    // AOP (공통 로깅)
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // 헬스체크 / 기본 메트릭 (GlobalExceptionHandler의 MeterRegistry 주입에 필요)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Micrometer -> Prometheus 노출. 모니터링 서버의 Prometheus가 /actuator/prometheus를 긁는다.
    //
    // actuator만 있으면 MeterRegistry는 SimpleMeterRegistry(메모리에만 쌓이고 밖으로 안 나감)다.
    // 이 의존성이 들어오면 PrometheusMeterRegistry로 바뀌어, 이미 계측해둔 커스텀 메트릭
    // (websocket.online.users, api_errors_total 등)까지 함께 노출된다. 코드 변경은 필요 없다.
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // API 문서 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Domain <-> JPA Entity 매핑
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

    // 계약서 PDF. 템플릿으로 HTML 을 만들고 그걸 PDF 로 굽는다.
    // 외부 전자서명 서비스를 쓰지 않기로 해서 문서 생성도 직접 한다.
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    // local 프로파일에서 인메모리 DB로 띄우기 위한 의존성.
    // developmentOnly라서 bootRun에는 포함되고 배포 jar에는 들어가지 않는다.
    developmentOnly 'com.h2database:h2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// 소스에 한글 주석·문자열이 들어가므로 인코딩을 명시한다.
// Java 17은 플랫폼 기본 인코딩을 쓰기 때문에, 지정하지 않으면 개발자 OS 설정에 따라
// 다른 장비에서 컴파일할 때 한글이 깨질 수 있다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    // CI(Linux)는 JVM 기본 타임존이 UTC다. PairingApplication의 @PostConstruct는
    // 컨텍스트 초기화 시점에 실행되는데, 그보다 먼저 만들어지는 DataSource/Hibernate가
    // 이미 UTC 기준으로 날짜를 다루기 시작해서 @PostConstruct로는 못 막는다.
    // JVM 시작 자체를 KST로 고정해야 로컬(KST)과 CI(UTC)의 날짜 계산이 어긋나지 않는다.
    systemProperty 'user.timezone', 'Asia/Seoul'
    testLogging {
        exceptionFormat = 'full'
    }
}
